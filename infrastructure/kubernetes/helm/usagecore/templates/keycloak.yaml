{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "usagecore.appLabels" (dict "name" "keycloak" "component" "identity" "Values" .Values "Chart" .Chart "Release" .Release) | nindent 4 }}
data:
  realm-usagecore.json: |
{{ .Files.Get "files/realm-usagecore.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "usagecore.appLabels" (dict "name" "keycloak" "component" "identity" "Values" .Values "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: usagecore
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: "{{ .Values.images.keycloak.repository }}:{{ .Values.images.keycloak.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["start-dev", "--import-realm"]
          ports:
            - name: http
              containerPort: {{ .Values.keycloak.httpPort }}
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: usagecore-secrets
                  key: KEYCLOAK_ADMIN
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: usagecore-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HTTP_PORT
              value: {{ .Values.keycloak.httpPort | quote }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/realm-usagecore.json
              subPath: realm-usagecore.json
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 15
            initialDelaySeconds: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            failureThreshold: 6
            initialDelaySeconds: 60
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "usagecore.appLabels" (dict "name" "keycloak" "component" "identity" "Values" .Values "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.keycloak.httpPort }}
      targetPort: http
{{- end }}
