apiVersion: v1
kind: Secret
metadata:
  name: usagecore-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "usagecore.appLabels" (dict "name" "usagecore" "component" "secrets" "Values" .Values "Chart" .Chart "Release" .Release) | nindent 4 }}
type: Opaque
stringData:
  # Local placeholder credentials only. Kubernetes Secret is not production secret management.
  USAGECORE_DB_USERNAME: {{ .Values.postgres.username | quote }}
  USAGECORE_DB_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  KEYCLOAK_ADMIN: {{ .Values.keycloak.adminUsername | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
