{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usagecore-control-plane
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "usagecore.appLabels" (dict "name" "control-plane" "component" "application" "Values" .Values "Chart" .Chart "Release" .Release) | nindent 4 }}
  {{- if or .Values.release.gitSha .Values.release.imageTag .Values.release.imageDigest }}
  annotations:
    {{- include "usagecore.releaseAnnotations" . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: usagecore
      {{- if or .Values.release.gitSha .Values.release.imageTag .Values.release.imageDigest }}
      annotations:
        {{- include "usagecore.releaseAnnotations" . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "usagecore.podSecurityContext" . | nindent 8 }}
      containers:
        - name: control-plane
          image: "{{ .Values.images.controlPlane.repository }}:{{ .Values.images.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "usagecore.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.controlPlane.port | quote }}
            {{- include "usagecore.dbEnv" . | nindent 12 }}
            {{- include "usagecore.commonEnv" . | nindent 12 }}
          {{- include "usagecore.probes" (dict "port" .Values.controlPlane.port "Values" .Values) | nindent 10 }}
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: usagecore-control-plane
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "usagecore.appLabels" (dict "name" "control-plane" "component" "application" "Values" .Values "Chart" .Chart "Release" .Release) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.controlPlane.port }}
      targetPort: http
{{- end }}
