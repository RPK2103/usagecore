services:
  postgres:
    image: postgres:16-alpine
    container_name: usagecore-postgres
    environment:
      # Local development credentials only — not for production.
      POSTGRES_DB: usagecore
      POSTGRES_USER: usagecore
      POSTGRES_PASSWORD: usagecore
    ports:
      - "5432:5432"
    volumes:
      - usagecore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usagecore -d usagecore"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local/demo identity provider only. Production target is Cognito (not configured here).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: usagecore-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-usagecore.json:/opt/keycloak/data/import/realm-usagecore.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Single-broker KRaft Kafka for local development only.
  # No ZooKeeper, Schema Registry, Connect, ksqlDB, or Kafka UI in this phase.
  kafka:
    image: apache/kafka:3.8.1
    container_name: usagecore-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Local Prometheus for scraping application /actuator/prometheus endpoints.
  # Grafana dashboards are Phase 9B — this image is scrape validation only.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: usagecore-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Minimal OTLP collector (debug exporter). No commercial APM backend.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: usagecore-otel-collector
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../observability/otel-collector/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

volumes:
  usagecore_pgdata:
