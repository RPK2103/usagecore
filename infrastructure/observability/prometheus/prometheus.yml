# Local Prometheus scrape + rule evaluation for UsageCore Phase 9B.
# Applications typically run on the host (IDE / mvnw); Prometheus runs in Docker.
# host.docker.internal is provided via extra_hosts in docker-compose.yml.
#
# Do not treat listed targets as healthy unless the applications are actually running.
# Alert thresholds in rules/ are DEMO / ENGINEERING DEFAULTS, not production SLOs.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: usagecore-control-plane
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: usagecore-control-plane

  - job_name: usagecore-entitlement-runtime
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          application: usagecore-entitlement-runtime

  - job_name: usagecore-usage-pipeline
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels:
          application: usagecore-usage-pipeline
