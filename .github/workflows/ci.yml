name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-verify:
    name: Java / Verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven clean verify
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: ignore

  terraform-validate:
    name: Terraform / Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Validate dev root without AWS
        run: |
          terraform -chdir=infrastructure/terraform/environments/dev init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/environments/dev validate

      - name: Validate bootstrap root without AWS
        run: |
          terraform -chdir=infrastructure/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/bootstrap validate

  helm-validate:
    name: Helm / Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint and template
        run: |
          helm lint infrastructure/kubernetes/helm/usagecore
          helm template usagecore infrastructure/kubernetes/helm/usagecore --namespace usagecore >/dev/null
          helm template usagecore infrastructure/kubernetes/helm/usagecore --namespace usagecore \
            -f infrastructure/kubernetes/helm/usagecore/values-aws.yaml >/dev/null

  compose-validate:
    name: Compose / Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Compose config
        run: docker compose -f infrastructure/docker/docker-compose.yml config --quiet

      - name: Git diff check
        run: git diff --check
