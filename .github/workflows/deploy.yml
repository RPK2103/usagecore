name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options:
          - dev
        default: dev
      image_tag:
        description: Immutable image tag (git SHA)
        required: true
      apply_infrastructure:
        description: Run terraform apply from a plan generated in this job
        type: boolean
        default: false
      install_alb_controller:
        description: Install AWS Load Balancer Controller if missing
        type: boolean
        default: false
      deploy_application:
        description: Helm upgrade application workloads
        type: boolean
        default: true
      run_smoke:
        description: Run authenticated post-deploy smoke
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: usagecore-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  infrastructure:
    name: Deploy / Infrastructure
    if: github.event.inputs.apply_infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC apply role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TERRAFORM_APPLY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan then apply the saved plan
        run: |
          bash scripts/ci/terraform-plan.sh "${RUNNER_TEMP}/tfplan"
          bash scripts/ci/terraform-apply.sh "${RUNNER_TEMP}/tfplan"

  application:
    name: Deploy / Application
    needs: [infrastructure]
    if: always() && github.event.inputs.deploy_application == 'true' && (needs.infrastructure.result == 'success' || needs.infrastructure.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          TARGET_ENVIRONMENT: ${{ github.event.inputs.environment }}
        run: bash -c 'source scripts/ci/lib.sh && validate_image_tag "$IMAGE_TAG" && validate_environment "$TARGET_ENVIRONMENT"'

      - name: Set up Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Configure AWS credentials (OIDC deploy role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_HELM_DEPLOY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME || 'usagecore-dev' }}" --region "${AWS_REGION}"

      - name: Install AWS Load Balancer Controller
        if: github.event.inputs.install_alb_controller == 'true'
        run: |
          bash scripts/ci/install-alb-controller.sh \
            "${{ vars.EKS_CLUSTER_NAME || 'usagecore-dev' }}" \
            "${AWS_REGION}" \
            "${{ vars.ALB_CONTROLLER_ROLE_ARN }}" \
            "${{ vars.VPC_ID }}"

      - name: Sync runtime secrets
        env:
          RDS_SECRET_ARN: ${{ vars.RDS_MASTER_USER_SECRET_ARN }}
          MSK_SECRET_ARN: ${{ vars.MSK_SCRAM_SECRET_ARN }}
        run: bash scripts/ci/sync-runtime-secrets.sh usagecore "${RDS_SECRET_ARN}" "${MSK_SECRET_ARN}"

      - name: Helm upgrade
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          RDS_ENDPOINT: ${{ vars.RDS_ENDPOINT }}
          MSK_BOOTSTRAP_BROKERS: ${{ vars.MSK_BOOTSTRAP_BROKERS }}
          OIDC_JWK_SET_URI: ${{ vars.OIDC_JWK_SET_URI }}
          ALB_SECURITY_GROUP_ID: ${{ vars.ALB_SECURITY_GROUP_ID }}
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          bash scripts/ci/helm-upgrade-aws.sh \
            usagecore \
            "${IMAGE_TAG}" \
            "${ECR_REGISTRY}" \
            "${GITHUB_SHA}" \
            "" \
            "${RDS_ENDPOINT}" \
            "${MSK_BOOTSTRAP_BROKERS}" \
            "${OIDC_JWK_SET_URI}" \
            "${ALB_SECURITY_GROUP_ID}"

      - name: Post-deploy smoke
        if: github.event.inputs.run_smoke == 'true'
        env:
          USAGECORE_SMOKE_ENTITLEMENT_URL: ${{ vars.SMOKE_ENTITLEMENT_URL }}
          USAGECORE_SMOKE_USAGE_URL: ${{ vars.SMOKE_USAGE_URL }}
          USAGECORE_SMOKE_TOKEN_URL: ${{ vars.SMOKE_TOKEN_URL }}
          USAGECORE_SMOKE_CLIENT_ID: ${{ vars.SMOKE_CLIENT_ID }}
          USAGECORE_SMOKE_USERNAME: ${{ vars.SMOKE_USERNAME }}
          USAGECORE_SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash scripts/ci/post-deploy-smoke.sh
