name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_plan:
        description: Type plan to run terraform plan against AWS (OIDC).
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    name: Terraform / Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Validate without AWS
        run: |
          terraform -chdir=infrastructure/terraform/environments/dev init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/environments/dev validate
          terraform -chdir=infrastructure/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infrastructure/terraform/bootstrap validate

  plan:
    name: Terraform / Plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_plan == 'plan' && vars.AWS_ROLE_TERRAFORM_PLAN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TERRAFORM_PLAN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Terraform plan
        run: bash scripts/ci/terraform-plan.sh "${RUNNER_TEMP}/tfplan"

      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ runner.temp }}/tfplan
          retention-days: 3
