name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag (git SHA). Empty uses github.sha.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  build:
    name: Container / Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image tag
        id: meta
        env:
          REQUESTED_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          TAG="${REQUESTED_TAG}"
          if [ -z "${TAG}" ]; then
            TAG="${GITHUB_SHA}"
          fi
          if ! echo "${TAG}" | grep -Eq '^[a-fA-F0-9]{7,40}$|^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$'; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          echo "image_tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build images
        run: bash scripts/ci/build-images.sh "${{ steps.meta.outputs.image_tag }}"

      - name: Trivy scan control-plane
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: usagecore/control-plane:${{ steps.meta.outputs.image_tag }}
          severity: CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Trivy scan entitlement-runtime
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: usagecore/entitlement-runtime:${{ steps.meta.outputs.image_tag }}
          severity: CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true

      - name: Trivy scan usage-pipeline
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: usagecore/usage-pipeline:${{ steps.meta.outputs.image_tag }}
          severity: CRITICAL
          exit-code: "1"
          format: table
          hide-progress: true

      - name: SBOM control-plane
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: usagecore/control-plane:${{ steps.meta.outputs.image_tag }}
          format: cyclonedx
          output: sbom-control-plane.json
          hide-progress: true
          exit-code: "0"

      - name: SBOM entitlement-runtime
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: usagecore/entitlement-runtime:${{ steps.meta.outputs.image_tag }}
          format: cyclonedx
          output: sbom-entitlement-runtime.json
          hide-progress: true
          exit-code: "0"

      - name: SBOM usage-pipeline
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: usagecore/usage-pipeline:${{ steps.meta.outputs.image_tag }}
          format: cyclonedx
          output: sbom-usage-pipeline.json
          hide-progress: true
          exit-code: "0"

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ steps.meta.outputs.image_tag }}
          path: |
            sbom-control-plane.json
            sbom-entitlement-runtime.json
            sbom-usage-pipeline.json
          retention-days: 30

      - name: Save scanned images
        if: github.event_name != 'pull_request'
        run: |
          docker save \
            "usagecore/control-plane:${{ steps.meta.outputs.image_tag }}" \
            "usagecore/entitlement-runtime:${{ steps.meta.outputs.image_tag }}" \
            "usagecore/usage-pipeline:${{ steps.meta.outputs.image_tag }}" \
            | gzip > usagecore-images.tar.gz

      - name: Upload scanned images
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usagecore-images-${{ steps.meta.outputs.image_tag }}
          path: usagecore-images.tar.gz
          retention-days: 1

  publish:
    name: Container / Publish ECR
    needs: build
    if: github.event_name != 'pull_request' && vars.AWS_ROLE_ECR_PUBLISH != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download scanned images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: usagecore-images-${{ needs.build.outputs.image_tag }}

      - name: Load images
        run: gzip -dc usagecore-images.tar.gz | docker load

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_PUBLISH }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push the scanned images
        id: push
        run: |
          mkdir -p /tmp/usagecore-image-digests
          bash scripts/ci/push-ecr.sh "${{ needs.build.outputs.image_tag }}" "${{ steps.ecr.outputs.registry }}" /tmp/usagecore-image-digests
          echo "control_plane_digest=$(cat /tmp/usagecore-image-digests/control-plane.digest)" >> "${GITHUB_OUTPUT}"
          echo "entitlement_digest=$(cat /tmp/usagecore-image-digests/entitlement-runtime.digest)" >> "${GITHUB_OUTPUT}"
          echo "usage_pipeline_digest=$(cat /tmp/usagecore-image-digests/usage-pipeline.digest)" >> "${GITHUB_OUTPUT}"

      - name: Attest control-plane
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/usagecore-control-plane
          subject-digest: ${{ steps.push.outputs.control_plane_digest }}
          push-to-registry: false

      - name: Attest entitlement-runtime
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/usagecore-entitlement-runtime
          subject-digest: ${{ steps.push.outputs.entitlement_digest }}
          push-to-registry: false

      - name: Attest usage-pipeline
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ecr.outputs.registry }}/usagecore-usage-pipeline
          subject-digest: ${{ steps.push.outputs.usage_pipeline_digest }}
          push-to-registry: false
