spring:
  application:
    name: usagecore-entitlement-runtime
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Local Keycloak JWKS. Production target is Cognito later.
          jwk-set-uri: ${USAGECORE_JWK_SET_URI:http://localhost:8081/realms/usagecore/protocol/openid-connect/certs}
  datasource:
    url: ${USAGECORE_DB_URL:jdbc:postgresql://localhost:5432/usagecore}
    username: ${USAGECORE_DB_USERNAME:usagecore}
    password: ${USAGECORE_DB_PASSWORD:usagecore}
  # Control Plane owns production schema migrations.
  # Runtime replicas must not mutate shared production schema on every startup.
  # Integration tests may override spring.flyway.enabled=true against Testcontainers.
  flyway:
    enabled: false
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
    prometheus:
      access: read_only
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${USAGECORE_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${USAGECORE_OTLP_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      endpoint: ${USAGECORE_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      transport: http

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] [%X{traceId:-}] [%X{spanId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    io.usagecore: INFO
