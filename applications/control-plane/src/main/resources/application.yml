spring:
  application:
    name: usagecore-control-plane
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Local Keycloak JWKS. Production target is Cognito later.
          # jwk-set-uri is used so the app can start without eager OIDC discovery.
          jwk-set-uri: ${USAGECORE_JWK_SET_URI:http://localhost:8081/realms/usagecore/protocol/openid-connect/certs}
  datasource:
    url: ${USAGECORE_DB_URL:jdbc:postgresql://localhost:5432/usagecore}
    username: ${USAGECORE_DB_USERNAME:usagecore}
    password: ${USAGECORE_DB_PASSWORD:usagecore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    io.usagecore: INFO
